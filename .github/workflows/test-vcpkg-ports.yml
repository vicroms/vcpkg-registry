name: Test vcpkg ports

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Acquire vcpkg
      uses: actions/checkout@v4
      with:
        repository: "Microsoft/vcpkg"
        path: vcpkg

    - name: Bootstrap vcpkg
      shell: bash
      run: "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"

    - name: Add NuGet sources
      shell: bash
      env:
        VCPKG_EXE: "${{ github.workspace }}/vcpkg/vcpkg"
        FEED_URL: "https://nuget.pkg.github.com/vicroms/index.json"
      run: |
        mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
          sources add \
          -Name "GitHubPackages" \
          -Source "${{ env.FEED_URL }}" \
          -UserName "vicroms" \
          -Password "${{ secrets.GITHUB_TOKEN }}" \
          -StorePasswordInClearText
        if [[ "${{ github.event_name }}" == "push" ]]; then
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -Source "${{ env.FEED_URL }}"
        fi

    - name: Build ports
      shell: bash
      env:
        VCPKG_OVERLAY_PORTS: "${{ github.workspace }}/ports"
        VCPKG_BINARY_SOURCES: "${{ github.event_name == 'push' && 'clear;nuget,https://nuget.pkg.github.com/vicroms/index.json,readwrite' || 'clear;nuget,https://nuget.pkg.github.com/vicroms/index.json,read' }}"
      run: ${{ github.workspace }}/vcpkg/vcpkg install
